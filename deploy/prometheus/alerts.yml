# ============================================================
# rd-knowledge-svc 业务告警规则（Prometheus Alertmanager 消费）
#
# 指标来源：src/core/metrics.py 暴露的 http_requests_total /
# http_request_duration_seconds / llm_tokens_total / retrieval_requests_total /
# rate_limit_rejected_total / circuit_breaker_state_changes_total / ingestion_jobs_total
#
# 使用：把本文件挂载到 Prometheus rules 目录即可。
#   prometheus.yml:
#     rule_files:
#       - "/etc/prometheus/alerts.yml"
# ============================================================

groups:
  - name: rd-knowledge-svc-core
    rules:
      # ── 核心链路可用性 ─────────────────────────────────────────
      # 5xx 比例连续 5 分钟超过 5%（样本数 >= 50 才判定，避免小流量误报）
      - alert: KnowledgeSvcHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-6)
          > 0.05
        for: 5m
        labels:
          severity: critical
          service: rd-knowledge-svc
        annotations:
          summary: "知识检索服务 5xx 错误率过高"
          description: "5xx 占比 {{ $value | humanizePercentage }}（持续 5 分钟），核心链路异常。"

      # ── 延迟 ─────────────────────────────────────────────────
      - alert: KnowledgeSvcHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "知识检索服务 p95 延迟过高"
          description: "p95 延迟 {{ $value }}s（持续 10 分钟），可能 LLM 或下游通道变慢。"

      # ── 检索通道失败 ─────────────────────────────────────────
      # 任一通道失败率（失败+跳过 占 全部调用）持续 10 分钟超 30%
      - alert: KnowledgeSvcRetrievalDegraded
        expr: |
          sum(rate(retrieval_requests_total{status=~"failed|skipped"}[10m])) by (channel)
            / clamp_min(sum(rate(retrieval_requests_total[10m])) by (channel), 1e-6)
          > 0.3
        for: 10m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "检索通道 {{ $labels.channel }} 降级"
          description: "通道 {{ $labels.channel }} 失败/空返回占比 {{ $value | humanizePercentage }}，建议检查 Milvus/Neo4j/只读库。"

      # ── 限流过载 ─────────────────────────────────────────────
      # 429 速率持续 10 分钟超 5 req/s → 用户被限流过多，需扩容或调参
      - alert: KnowledgeSvcRateLimitStorm
        expr: |
          sum(rate(rate_limit_rejected_total[10m])) > 5
        for: 10m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "大量请求被限流"
          description: "限流拒绝速率 {{ $value }} req/s，可能是异常流量或限流阈值过严。"

      # ── 熔断 ─────────────────────────────────────────────────
      # 任一熔断器停留在 open 状态超 2 分钟 → 下游不可用
      - alert: KnowledgeSvcCircuitOpen
        expr: |
          # 用"进入 open 的累计次数增量"近似判断：最近 2 分钟有 open 切换则告警
          increase(circuit_breaker_state_changes_total{state="open"}[2m]) > 0
        for: 1m
        labels:
          severity: critical
          service: rd-knowledge-svc
        annotations:
          summary: "熔断器 {{ $labels.target }} 已打开"
          description: "目标 {{ $labels.target }} 熔断打开，依赖不可用，请求将被快速失败。"

      # ── 入库任务 ─────────────────────────────────────────────
      # 入库失败数持续 10 分钟超 3 个
      - alert: KnowledgeSvcIngestFailures
        expr: |
          increase(ingestion_jobs_total{status="failed"}[10m]) > 3
        for: 5m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "文档入库任务大量失败"
          description: "最近 10 分钟入库失败 {{ $value }} 次，检查 MinerU 解析 / embedding / Milvus 写入。"

  # ── LLM 成本水位 ───────────────────────────────────────────
  - name: rd-knowledge-svc-cost
    rules:
      # 单实例 5 分钟输出 token 速率超过 10k/min 提示成本告警
      - alert: KnowledgeSvcTokenSpike
        expr: |
          sum(rate(llm_tokens_total{kind="output"}[5m])) > 10000
        for: 10m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "LLM 输出 token 速率激增"
          description: "输出 token 速率 {{ $value }} /s，注意成本；可检查是否有异常重试或死循环。"

      # 按模型折算的美元成本速率（需先由检索链路记账，见 core/quota.py add_tokens）
      - alert: KnowledgeSvcCostRateHigh
        expr: |
          sum(rate(llm_cost_usd_total[1h])) * 3600 > 5
        for: 15m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "LLM 成本速率偏高"
          description: "预计每小时成本 {{ $value }} 美元。按 llm_cost_usd_total 的 model 维度定位是哪个链路在烧。"

      # 配额拒绝激增 = 有人在触顶，也可能配额设得过紧误伤正常用户
      - alert: KnowledgeSvcQuotaRejections
        expr: |
          sum(rate(token_quota_rejected_total[10m])) > 0.2
        for: 10m
        labels:
          severity: info
          service: rd-knowledge-svc
        annotations:
          summary: "Token 配额拒绝频繁"
          description: "配额拒绝速率 {{ $value }} /s。确认是异常调用还是 USER_DAILY_TOKEN_QUOTA 偏低。"

  # ── 结果质量 ───────────────────────────────────────────────
  - name: rd-knowledge-svc-quality
    rules:
      # 「空答案率」：检索成功但无内容 = 知识库覆盖不足（该补文档）。
      # 与 degraded（依赖故障）分开统计，否则分不清是内容缺口还是系统故障。
      - alert: KnowledgeSvcHighEmptyRate
        expr: |
          sum(rate(knowledge_retrieval_outcome_total{outcome="empty"}[30m]))
            / clamp_min(sum(rate(knowledge_retrieval_outcome_total[30m])), 1e-6)
          > 0.3
        for: 30m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "检索空答案率偏高"
          description: "{{ $value | humanizePercentage }} 的请求检索成功但没有内容。可能是语料覆盖不足、过滤条件过严，或切分/召回退化。"

      # 低置信拒答比例过高：要么阈值过严（误伤能答的问题），要么语料真的缺
      # 这类内容。与 empty 分开看——empty 是"召回为空"，这个是"召回了但不够像"。
      - alert: KnowledgeSvcHighRefusalRate
        expr: |
          sum(rate(knowledge_retrieval_outcome_total{outcome="low_confidence"}[30m]))
            / clamp_min(sum(rate(knowledge_retrieval_outcome_total[30m])), 1e-6)
          > 0.2
        for: 30m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "低置信拒答比例偏高"
          description: "{{ $value | humanizePercentage }} 的请求因置信度不足被拒答。检查 RAG_REFUSE_THRESHOLD 是否偏严（换过 reranker 需重新标定），或语料覆盖是否有缺口。"

      # 全部通道故障：用户侧已按 503 应答，这里给出比 5xx 更明确的语义
      - alert: KnowledgeSvcRetrievalUnavailable
        expr: |
          sum(rate(knowledge_retrieval_outcome_total{outcome="degraded"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          service: rd-knowledge-svc
        annotations:
          summary: "检索全面不可用（全部通道故障）"
          description: "所有检索通道均失败，用户收到 503。立即检查 Milvus / embedding 上游 / Neo4j 可用性。"

  # ── 入库队列积压 ───────────────────────────────────────────
  - name: rd-knowledge-svc-queue
    rules:
      # 队列持续积压：消费者跟不上，或 worker 已挂
      - alert: KnowledgeSvcIngestQueueBacklog
        expr: |
          max_over_time(ingest_queue_depth{kind="stream"}[15m]) > 200
        for: 15m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "入库队列积压"
          description: "队列深度 {{ $value }} 持续 15 分钟。检查 worker 存活、MinerU 是否变慢、是否需要扩容副本。"

      # PEL 待确认消息堆积 = 消息已投递但未确认（worker 崩溃或卡死）
      - alert: KnowledgeSvcIngestPelBacklog
        expr: |
          max_over_time(ingest_queue_depth{kind="pel"}[15m]) > 50
        for: 15m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "入库 PEL 待确认消息堆积"
          description: "PEL 深度 {{ $value }} 持续 15 分钟。可能有 worker 崩溃未被回收，检查心跳键与 PEL 回收日志。"

  # ── 尾延迟 ─────────────────────────────────────────────────
  - name: rd-knowledge-svc-tail-latency
    rules:
      # p99 单独告警：p95 达标不代表尾部健康（Milvus 实测 P99/P50 可达 2.04）
      - alert: KnowledgeSvcTailLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{path=~".*knowledge.*"}[10m])) by (le)
          ) > 15
        for: 10m
        labels:
          severity: warning
          service: rd-knowledge-svc
        annotations:
          summary: "知识检索 p99 延迟过高"
          description: "p99 延迟 {{ $value }}s（持续 10 分钟）。尾延迟通常来自 Milvus 慢查询、LLM 排队或重试放大，用 retrieval_channel_duration_seconds 定位通道。"
