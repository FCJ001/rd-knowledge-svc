# ============================================================
# 本项目独立编排（与项目一 rd-agent 完全隔离的实例与数据卷）
# 端口约定：错开本机已占用端口（5433/6380/7474/7687/9000/9091/9200/15432/16379/19091/19530/19531）
#   postgres 15433 · redis 16380 · minio 9002(API)/9003(控制台)
#   milvus 19540(健康检查 19092) · neo4j 7475(HTTP)/7688(Bolt) · api 8002
# 启动：docker compose up -d --build
# 注意：APP_ENV 非 prod 时为开发语义（header 认证、CORS 放开）
# ============================================================

x-app-base: &app-base
  build: .
  image: rd-knowledge-svc
  env_file: .env
  environment:
    - APP_ENV=${APP_ENV:-dev}
    - DB_HOST=postgres
    - REDIS_HOST=redis
    - MILVUS_HOST=milvus
    - NEO4J_URI=bolt://neo4j:7687
    - MINIO_ENDPOINT=minio:9000
  volumes:
    - ./logs:/tmp/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  api:
    <<: *app-base
    ports:
      - "8002:8002"
    restart: unless-stopped
    # ★ 生产（APP_ENV=prod）：健康检查失败自动摘除重启
  worker:
    <<: *app-base
    command: ["python", "-m", "src.rag.ingestion.worker"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "15433:5432"
    environment:
      POSTGRES_USER: rdagent
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rdagent123}
      POSTGRES_DB: rd_knowledge
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdagent -d rd_knowledge"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.13
    command: ["milvus", "run", "standalone"]
    # ★ 与本机已验证可用的部署形态一致：外置 etcd + 复用本 compose 的 minio + woodpecker MQ
    #   （嵌入式 etcd + local storage 在 macOS/arm64 上启动即 OOM 崩溃，勿改回）
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
      LD_PRELOAD: :/milvus/lib/libjemalloc.so
      MALLOC_CONF: background_thread:true
    mem_limit: 2g
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19540:19530"
      - "19092:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-rdagent123}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
  milvus_data:
  etcd_data:
  neo4j_data:
