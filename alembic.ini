# ============================================================
# Alembic 配置
#
# 与项目一配置一致：
#   prepend_sys_path = .  → env.py 能 import src.*
#   sqlalchemy.url 留空    → 由 env.py 从 Settings 注入
#
# 常用命令：
#   alembic revision --autogenerate -m "xxx"
#   alembic upgrade head
#   alembic upgrade head --sql
#   alembic current / history --verbose
#   alembic downgrade -1
# ============================================================

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# 留空！由 env.py 从 Settings 注入
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
